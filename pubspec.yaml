name: homemanagement
description: Home Management System. Property, rent, utility expense and invoice manager for landlords and building managers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Firebase (cloud sync + auth)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

  # Google sign-in + Drive backups
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^17.0.0

  # Invoices
  pdf: ^3.13.1
  printing: ^5.15.1

  # Utilities
  intl: any
  shared_preferences: ^2.5.6

  # Phone notifications on the free Firebase plan
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10

  # Onboarding animations
  lottie: ^3.6.1

dependency_overrides:
  # shared_preferences_android 2.5.x uses JNI, whose native side doesn't
  # register on this setup ("No instance with no name has been registered"),
  # so the app crashed at startup. 2.4.29 is the last version before JNI.
  shared_preferences_android: 2.4.29

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Use CocoaPods for iOS plugins. With Swift Package Manager, Firebase iOS SDK
  # 13 and Google Sign-In 9 require incompatible gtm-session-fetcher versions.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/animations/
