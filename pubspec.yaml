name: homemanagement
description: Home Management System. Property, rent, utility expense and invoice manager for landlords and building managers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Firebase (cloud sync + auth)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

  # Google sign-in + Drive backups
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^17.0.0

  # Invoices
  pdf: ^3.13.1
  printing: ^5.15.1

  # Utilities
  intl: any
  shared_preferences: ^2.5.6

  # Phone notifications on the free Firebase plan
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10

  # Onboarding animations
  lottie: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/animations/
